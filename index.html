<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>ChopA Beauty ✨</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet"/>
<style>
:root {
  --pink: #e91e8c;
  --pink-l: #ff6ec7;
  --pink-d: #b5006a;
  --dark: #0d0509;
  --dark2: #160b12;
  --card: #1e0d18;
  --card2: #261020;
  --text: #fceef6;
  --muted: #9a6080;
  --gold: #f5c842;
  --gold2: #ffedaa;
  --border: rgba(233,30,140,0.18);
  --glow: rgba(233,30,140,0.35);
}

*{margin:0;padding:0;box-sizing:border-box;}

body {
  font-family: 'Tajawal', sans-serif;
  background: var(--dark);
  color: var(--text);
  min-height: 100vh;
  overflow-x: hidden;
}

/* ─── GRAIN OVERLAY ─── */
body::before {
  content:'';
  position:fixed;inset:0;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
  pointer-events:none;z-index:9999;opacity:0.6;
}

/* ─── PAGE SYSTEM ─── */
.page{display:none;}
.page.active{display:block;animation:fadeIn 0.4s ease;}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* ─── NAV ─── */
nav {
  position: sticky; top:0; z-index:500;
  background: rgba(13,5,9,0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--border);
  height: 70px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 32px;
}

.logo {
  font-family: 'Playfair Display', serif;
  font-size: 26px;
  font-weight: 900;
  background: linear-gradient(120deg, var(--pink), var(--pink-l), var(--gold));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: 1px;
  cursor: pointer;
}
.logo span { font-size:18px; }

.nav-links { display:flex; align-items:center; gap:6px; }

.nav-btn {
  background: transparent;
  border: none;
  color: var(--muted);
  padding: 9px 18px;
  border-radius: 30px;
  cursor: pointer;
  font-family: 'Tajawal', sans-serif;
  font-size: 15px;
  font-weight: 500;
  transition: all 0.25s;
  position: relative;
}
.nav-btn:hover { color: var(--text); background: var(--card2); }
.nav-btn.active-nav {
  background: linear-gradient(135deg, var(--pink), var(--pink-l));
  color: white;
}

.nav-cart-btn {
  background: linear-gradient(135deg, var(--pink-d), var(--pink)) !important;
  color: white !important;
  position: relative;
  padding-left: 22px !important;
}
.cart-badge {
  position: absolute; top: -5px; right: -5px;
  background: var(--gold); color: #0d0509;
  width: 20px; height: 20px;
  border-radius: 50%;
  font-size: 11px; font-weight: 900;
  display: flex; align-items:center; justify-content:center;
  font-family: monospace;
  border: 2px solid var(--dark);
  transition: transform 0.2s;
}
.cart-badge.pop { transform: scale(1.4); }

/* ─── HERO ─── */
.hero {
  min-height: 88vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  position: relative;
  overflow: hidden;
  padding: 60px 20px;
}

.hero-bg {
  position: absolute; inset:0;
  background:
    radial-gradient(ellipse 80% 60% at 50% 0%, rgba(233,30,140,0.18) 0%, transparent 70%),
    radial-gradient(ellipse 50% 40% at 80% 80%, rgba(255,110,199,0.12) 0%, transparent 60%),
    radial-gradient(ellipse 40% 40% at 10% 60%, rgba(245,200,66,0.07) 0%, transparent 60%);
}

.hero-orbs {
  position:absolute;inset:0;pointer-events:none;overflow:hidden;
}
.orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(80px);
  animation: float 8s ease-in-out infinite;
}
.orb1 { width:400px;height:400px; background:rgba(233,30,140,0.12); top:-100px;left:-80px; animation-delay:0s; }
.orb2 { width:300px;height:300px; background:rgba(255,110,199,0.1); bottom:-50px;right:-60px; animation-delay:3s; }
.orb3 { width:200px;height:200px; background:rgba(245,200,66,0.08); top:40%;left:60%; animation-delay:5s; }

@keyframes float {
  0%,100%{transform:translateY(0) scale(1);}
  50%{transform:translateY(-30px) scale(1.05);}
}

.hero-tag {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(233,30,140,0.12);
  border: 1px solid rgba(233,30,140,0.3);
  border-radius: 30px;
  padding: 7px 18px;
  font-size: 13px;
  color: var(--pink-l);
  margin-bottom: 28px;
  letter-spacing: 0.5px;
}

.hero h1 {
  font-family: 'Playfair Display', serif;
  font-size: clamp(52px, 9vw, 100px);
  font-weight: 900;
  line-height: 1.05;
  background: linear-gradient(135deg, #fff 0%, var(--pink-l) 40%, var(--gold) 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-bottom: 20px;
}

.hero p {
  font-size: clamp(16px, 2.5vw, 22px);
  color: var(--muted);
  max-width: 520px;
  line-height: 1.7;
  margin-bottom: 40px;
  font-weight: 300;
}

.hero-btns { display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }

.btn-primary {
  padding: 16px 44px;
  background: linear-gradient(135deg, var(--pink), var(--pink-l));
  border: none; border-radius: 50px;
  color: white; font-size: 17px; font-weight: 700;
  cursor: pointer; font-family: 'Tajawal', sans-serif;
  transition: all 0.3s;
  box-shadow: 0 8px 30px rgba(233,30,140,0.4);
}
.btn-primary:hover { transform:translateY(-3px); box-shadow: 0 14px 40px rgba(233,30,140,0.55); }

.btn-outline {
  padding: 16px 36px;
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 50px;
  color: var(--text); font-size: 16px; font-weight: 500;
  cursor: pointer; font-family: 'Tajawal', sans-serif;
  transition: all 0.3s;
  backdrop-filter: blur(10px);
}
.btn-outline:hover { border-color: var(--pink); color: var(--pink); }

/* ─── STATS BAR ─── */
.stats-bar {
  display: flex;
  justify-content: center;
  gap: 50px;
  padding: 28px 20px;
  background: var(--dark2);
  border-top: 1px solid var(--border);
  border-bottom: 1px solid var(--border);
  flex-wrap: wrap;
}
.stat { text-align:center; }
.stat-num { font-family: 'Playfair Display', serif; font-size: 30px; color: var(--pink); font-weight: 900; }
.stat-label { font-size: 12px; color: var(--muted); margin-top: 2px; letter-spacing:0.5px; }

/* ─── CATEGORIES ─── */
.section { padding: 60px 20px; max-width: 1300px; margin: 0 auto; }
.section-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:32px; }
.section-title {
  font-family: 'Playfair Display', serif;
  font-size: 32px;
  color: var(--text);
}
.section-title span { color: var(--pink); }
.see-all { color: var(--pink); font-size:14px; cursor:pointer; border:none; background:none; font-family:'Tajawal',sans-serif; }
.see-all:hover { text-decoration:underline; }

.cats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 16px;
  margin-bottom: 50px;
}
.cat-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 24px 16px;
  text-align: center;
  cursor: pointer;
  transition: all 0.3s;
}
.cat-card:hover, .cat-card.active-cat {
  background: rgba(233,30,140,0.12);
  border-color: var(--pink);
  transform: translateY(-4px);
}
.cat-icon { font-size: 36px; margin-bottom: 10px; }
.cat-name { font-size: 14px; font-weight: 600; }
.cat-count { font-size: 11px; color: var(--muted); margin-top:4px; }

/* ─── PRODUCT GRID ─── */
.products-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 24px;
}

.product-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 24px;
  overflow: hidden;
  transition: all 0.35s;
  cursor: pointer;
  position: relative;
}
.product-card:hover {
  transform: translateY(-10px);
  box-shadow: 0 24px 50px rgba(233,30,140,0.22);
  border-color: rgba(233,30,140,0.4);
}

.product-img-wrap {
  position: relative;
  height: 240px;
  overflow: hidden;
}
.product-img-wrap img {
  width:100%; height:100%;
  object-fit:cover;
  transition: transform 0.5s;
}
.product-card:hover .product-img-wrap img { transform: scale(1.06); }

.badge-new {
  position:absolute; top:14px; right:14px;
  background: var(--gold);
  color: #0d0509;
  font-size: 11px; font-weight: 900;
  padding: 4px 12px; border-radius: 20px;
}
.badge-sale {
  position:absolute; top:14px; right:14px;
  background: var(--pink);
  color: white;
  font-size: 11px; font-weight: 900;
  padding: 4px 12px; border-radius: 20px;
}

.wishlist-btn {
  position:absolute; top:14px; left:14px;
  width:34px; height:34px;
  background: rgba(13,5,9,0.7);
  border: 1px solid var(--border);
  border-radius: 50%;
  display:flex; align-items:center; justify-content:center;
  cursor:pointer; font-size:16px;
  backdrop-filter: blur(10px);
  transition: all 0.2s;
  border:none;
}
.wishlist-btn:hover { background: rgba(233,30,140,0.3); transform:scale(1.1); }
.wishlist-btn.liked { background: rgba(233,30,140,0.2); }

.product-info { padding: 18px; }
.brand-tag { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
.product-name { font-size: 16px; font-weight: 700; margin: 6px 0 4px; line-height:1.3; }

.stars { color: var(--gold); font-size: 12px; margin-bottom: 12px; }
.stars span { color: var(--muted); font-size: 11px; margin-right: 4px; }

.product-footer { display:flex; align-items:center; justify-content:space-between; }
.price { font-size: 22px; font-weight: 900; color: var(--pink); }
.price-old { font-size: 13px; color: var(--muted); text-decoration: line-through; margin-right: 6px; }

.add-btn {
  width: 44px; height: 44px;
  background: linear-gradient(135deg, var(--pink), var(--pink-l));
  border: none; border-radius: 50%;
  color: white; font-size: 24px;
  cursor: pointer;
  display:flex; align-items:center; justify-content:center;
  transition: all 0.25s;
  box-shadow: 0 4px 16px rgba(233,30,140,0.4);
}
.add-btn:hover { transform: scale(1.15); box-shadow: 0 6px 22px rgba(233,30,140,0.6); }
.add-btn:active { transform: scale(0.95); }

/* ─── QUICK FILTER ─── */
.filter-bar {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-bottom: 28px;
  align-items: center;
}
.filter-chip {
  padding: 8px 20px;
  border-radius: 30px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  font-family: 'Tajawal', sans-serif;
  font-size: 14px;
  transition: all 0.2s;
}
.filter-chip:hover, .filter-chip.active-filter {
  background: var(--pink);
  border-color: var(--pink);
  color: white;
}
.search-wrap { flex:1; min-width: 200px; position:relative; }
.search-input {
  width: 100%;
  padding: 10px 18px 10px 44px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 30px;
  color: var(--text);
  font-family: 'Tajawal', sans-serif;
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s;
  direction: rtl;
}
.search-input:focus { border-color: var(--pink); }
.search-input::placeholder { color: var(--muted); }
.search-icon { position:absolute; left:15px; top:50%; transform:translateY(-50%); color:var(--muted); font-size:16px; pointer-events:none; }

/* ─── CART PAGE ─── */
.cart-layout {
  display: grid;
  grid-template-columns: 1fr 340px;
  gap: 30px;
  max-width: 1100px;
  margin: 0 auto;
  padding: 50px 20px;
}
@media(max-width:800px){ .cart-layout { grid-template-columns:1fr; } }

.cart-item {
  display: flex;
  align-items: center;
  gap: 16px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 16px;
  margin-bottom: 14px;
  transition: all 0.2s;
}
.cart-item:hover { border-color: rgba(233,30,140,0.3); }
.cart-item img { width:80px;height:80px;object-fit:cover;border-radius:14px;flex-shrink:0; }
.cart-item-info { flex:1; }
.cart-item-name { font-weight: 700; font-size: 15px; }
.cart-item-brand { font-size: 12px; color: var(--muted); margin-bottom:8px; }
.qty-ctrl { display:flex; align-items:center; gap:10px; }
.qty-btn {
  width:30px;height:30px;
  background:var(--card2);
  border:1px solid var(--border);
  border-radius:50%;
  color:var(--text);font-size:18px;
  cursor:pointer;display:flex;align-items:center;justify-content:center;
  transition:all 0.2s;
  line-height:1;
}
.qty-btn:hover { border-color:var(--pink);color:var(--pink); }
.qty-num { font-size:16px;font-weight:700;min-width:24px;text-align:center; }
.cart-item-price { font-size:18px;font-weight:900;color:var(--pink);text-align:left; }
.remove-btn {
  background:none;border:none;color:var(--muted);
  cursor:pointer;font-size:20px;transition:color 0.2s;padding:4px;
}
.remove-btn:hover { color:#ff4444; }

.cart-summary {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 24px;
  padding: 28px;
  height: fit-content;
  position: sticky;
  top: 90px;
}
.summary-title { font-family:'Playfair Display',serif; font-size:22px; margin-bottom:24px; }
.summary-row { display:flex; justify-content:space-between; margin-bottom:14px; font-size:15px; color:var(--muted); }
.summary-divider { border:none; border-top:1px solid var(--border); margin:16px 0; }
.summary-total { display:flex; justify-content:space-between; font-size:20px; font-weight:900; margin-bottom:24px; }
.summary-total span:last-child { color:var(--pink); }

.promo-wrap { display:flex; gap:8px; margin-bottom:20px; }
.promo-input {
  flex:1; padding:11px 16px;
  background:var(--dark2); border:1px solid var(--border);
  border-radius:12px; color:var(--text);
  font-family:'Tajawal',sans-serif; font-size:14px; outline:none;
}
.promo-input:focus { border-color:var(--pink); }
.promo-btn {
  padding:11px 18px;
  background:var(--card2); border:1px solid var(--border);
  border-radius:12px; color:var(--text);
  cursor:pointer; font-family:'Tajawal',sans-serif;
  transition:all 0.2s;
}
.promo-btn:hover { border-color:var(--pink); color:var(--pink); }

.checkout-btn {
  width:100%;
  padding: 16px;
  background: linear-gradient(135deg, #25D366, #128C7E);
  border:none; border-radius:50px;
  color:white; font-size:17px; font-weight:800;
  cursor:pointer; font-family:'Tajawal',sans-serif;
  display:flex; align-items:center; justify-content:center; gap:10px;
  transition:all 0.3s;
  box-shadow: 0 6px 24px rgba(37,211,102,0.35);
}
.checkout-btn:hover { transform:translateY(-2px); box-shadow:0 10px 30px rgba(37,211,102,0.5); }

.empty-cart {
  text-align:center; padding:80px 20px;
  grid-column: 1 / -1;
}
.empty-cart .big-icon { font-size:80px; margin-bottom:20px; opacity:0.4; }
.empty-cart p { color:var(--muted); margin-bottom:24px; }

/* ─── ADMIN ─── */
.admin-gate {
  display:flex; align-items:center; justify-content:center;
  min-height: 85vh; padding:20px;
}
.admin-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 28px;
  padding: 50px 45px;
  width: 100%; max-width: 420px;
  text-align: center;
}
.admin-card h2 { font-family:'Playfair Display',serif; font-size:28px; margin-bottom:8px; }
.admin-card p { color:var(--muted); font-size:14px; margin-bottom:32px; }
.a-input {
  width:100%; padding:14px 18px;
  background:var(--dark2); border:1px solid var(--border);
  border-radius:14px; color:var(--text);
  font-family:'Tajawal',sans-serif; font-size:15px;
  margin-bottom:14px; outline:none; transition:border 0.2s;
  text-align:right;
}
.a-input:focus { border-color:var(--pink); }
.a-login-btn {
  width:100%; padding:16px;
  background:linear-gradient(135deg,var(--pink),var(--pink-l));
  border:none; border-radius:50px;
  color:white; font-size:17px; font-weight:700;
  cursor:pointer; font-family:'Tajawal',sans-serif;
  transition:all 0.3s; margin-top:4px;
}
.a-login-btn:hover { transform:translateY(-2px); box-shadow:0 8px 25px rgba(233,30,140,0.4); }

/* ─── ADMIN DASHBOARD ─── */
.admin-dash { padding:40px 20px; max-width:1200px; margin:0 auto; }
.admin-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:36px; flex-wrap:wrap; gap:16px; }
.admin-header h2 { font-family:'Playfair Display',serif; font-size:30px; }

.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 18px;
  margin-bottom: 40px;
}
.kpi-card {
  background:var(--card); border:1px solid var(--border); border-radius:20px;
  padding:22px; text-align:center;
}
.kpi-icon { font-size:36px; margin-bottom:10px; }
.kpi-val { font-family:'Playfair Display',serif; font-size:32px; font-weight:900; color:var(--pink); }
.kpi-label { font-size:12px; color:var(--muted); margin-top:4px; letter-spacing:0.5px; }

.admin-tabs { display:flex; gap:8px; margin-bottom:28px; flex-wrap:wrap; }
.a-tab { padding:10px 24px; border-radius:30px; border:1px solid var(--border); background:transparent; color:var(--muted); cursor:pointer; font-family:'Tajawal',sans-serif; font-size:15px; transition:all 0.2s; }
.a-tab:hover, .a-tab.active-tab { background:var(--pink); border-color:var(--pink); color:white; }

.add-product-form {
  background:var(--card); border:1px solid var(--border); border-radius:24px; padding:28px;
}
.form-grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
@media(max-width:600px){ .form-grid { grid-template-columns:1fr; } }
.form-group { display:flex; flex-direction:column; gap:8px; }
.form-label { font-size:13px; color:var(--muted); font-weight:600; letter-spacing:0.5px; }
.form-input, .form-select {
  padding:12px 16px;
  background:var(--dark2); border:1px solid var(--border);
  border-radius:12px; color:var(--text);
  font-family:'Tajawal',sans-serif; font-size:15px;
  outline:none; transition:border 0.2s; text-align:right;
}
.form-input:focus, .form-select:focus { border-color:var(--pink); }
.form-select option { background:var(--dark2); }
.form-submit {
  padding:14px 36px;
  background:linear-gradient(135deg,var(--pink),var(--pink-l));
  border:none; border-radius:50px;
  color:white; font-size:16px; font-weight:700;
  cursor:pointer; font-family:'Tajawal',sans-serif;
  margin-top:16px; transition:all 0.3s;
}
.form-submit:hover { transform:translateY(-2px); box-shadow:0 8px 25px rgba(233,30,140,0.4); }

/* Products Table */
.products-table { width:100%; border-collapse:separate; border-spacing:0 8px; }
.products-table thead th {
  padding:12px 16px; text-align:right;
  font-size:12px; color:var(--muted); font-weight:600; letter-spacing:0.5px; text-transform:uppercase;
}
.products-table tbody tr {
  background:var(--card); border-radius:16px;
}
.products-table tbody td { padding:14px 16px; font-size:14px; }
.products-table tbody td:first-child { border-radius:0 16px 16px 0; }
.products-table tbody td:last-child { border-radius:16px 0 0 16px; }
.td-img { width:50px;height:50px;object-fit:cover;border-radius:10px; }
.td-status { display:inline-block; padding:4px 12px; border-radius:20px; font-size:11px; font-weight:700; }
.td-status.in { background:rgba(46,213,115,0.15); color:#2ed573; }
.td-status.low { background:rgba(255,180,0,0.15); color:#ffb400; }
.td-status.out { background:rgba(255,68,68,0.15); color:#ff4444; }
.tbl-action { background:none; border:1px solid var(--border); border-radius:8px; color:var(--muted); padding:5px 10px; cursor:pointer; font-size:12px; transition:all 0.2s; margin-right:4px; }
.tbl-action:hover { border-color:var(--pink); color:var(--pink); }
